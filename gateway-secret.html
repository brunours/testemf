<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Daily News Briefing — Gateway setup</title>
  <style>
    body{margin:0;padding:24px;background:#eef5f9;color:#14243c;font:16px/1.5 Arial,Helvetica,sans-serif}
    .card{max-width:720px;margin:0 auto;background:#fff;border:1px solid #d6e0e8;border-radius:14px;padding:24px;box-sizing:border-box}
    h1{font-size:26px;margin:0 0 8px}.sub{color:#52637a;margin-bottom:22px}.note{background:#f1f6fa;border-left:4px solid #2563eb;padding:11px 13px;border-radius:6px;color:#334155}
    .error{display:none;background:#fff1f2;border-left:4px solid #c8102e;padding:11px 13px;border-radius:6px;color:#7f1d1d;margin-bottom:18px}
    label{display:block;font-weight:700;margin:18px 0 6px}input{width:100%;box-sizing:border-box;font-size:16px;padding:11px;border:1px solid #b9c7d5;border-radius:8px}
    button{display:inline-block;margin-top:18px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <h1>Daily News Briefing — Gateway secret</h1>
    <div class="sub">Final one-time connection between Supabase and your Apps Script Gmail gateway.</div>
    <div id="err" class="error"></div>
    <div class="note">Paste the <b>GATEWAY_SECRET</b> generated by <code>setupGateway()</code>. It is submitted directly from your browser to Supabase Vault and is not stored in GitHub.</div>
    <form id="secretForm" method="post">
      <label for="gateway_secret">Gateway secret</label>
      <input id="gateway_secret" name="gateway_secret" type="password" autocomplete="off" minlength="32" required>
      <button type="submit">Save gateway secret</button>
    </form>
  </main>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);
      const token=params.get('token');
      const form=document.getElementById('secretForm');
      const err=document.getElementById('err');
      if(!token){
        err.style.display='block';
        err.textContent='This setup link is missing its one-time token.';
        form.querySelector('button').disabled=true;
        return;
      }
      form.action='https://rbwcmjtcmhnivkmoxpsj.supabase.co/functions/v1/daily-news-gmail-setup/gateway?token='+encodeURIComponent(token);
    })();
  </script>
</body>
</html>
